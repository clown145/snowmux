<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fonts - CrossMux</title>
    <style>
      h3 { margin: 0 0 8px 0; }
      .family-info { flex: 1; }
      .family-meta { color: var(--label-color); font-size: 0.9em; }
      .font-upload-form {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .font-upload-form input[type="file"] { flex: 1; min-width: 200px; }
    </style>
  <link rel="stylesheet" href="/assets/web.css" />
  <link rel="icon" type="image/svg+xml" href="/assets/crosspoint-icon.svg" />
  </head>
  <body class="web-ui">
    <!--#include file="../shared/Header.html.inc" -->
<main class="page-content">


    <div class="card" id="upload-fonts">
      <h2>Upload Fonts</h2>
      <p class="family-meta">Choose font files from one family. The device creates the family folder automatically.</p>
      <form class="font-upload-form" id="uploadForm">
        <input type="file" id="fontFiles" aria-label="Upload Fonts" accept=".cpfont" multiple />
        <button type="submit" id="uploadFonts" class="btn btn-primary" disabled>Upload</button>
      </form>
      <p id="pickedInfo" class="family-meta" aria-live="polite" style="margin: 8px 0 0;"></p>
      <div id="fontUploadProgress" class="font-upload-progress" hidden>
        <div class="progress-label">
          <span id="fontUploadStatus" role="status"></span>
          <span id="fontUploadPercent" aria-hidden="true">0%</span>
        </div>
        <progress id="fontUploadBar" max="100" value="0" aria-label="Font upload progress"></progress>
      </div>
    </div>

    <div class="card">
      <h2>Installed Fonts</h2>
      <div id="families"><p class="empty-state">Loading...</p></div>
    </div>

    </main>
<!--#include file="../shared/Footer.html.inc" -->
  <script>
    function formatSize(bytes) {
      if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
      if (bytes >= 1024) return (bytes / 1024).toFixed(0) + ' KB';
      return bytes + ' B';
    }

    // PSRAM boards also accept vector (.ttf/.otf/.ttc) uploads; set from /api/fonts.
    let allowVector = false;

    function fontExtRe() {
      return allowVector ? /\.(cpfont|ttf|otf|ttc)$/i : /\.cpfont$/i;
    }

    function supportedExts() {
      return allowVector ? '.cpfont, .ttf, .otf or .ttc' : '.cpfont';
    }

    async function loadFonts() {
      const el = document.getElementById('families');
      try {
        const res = await fetch('/api/fonts');
        // Non-OK replies have no families; report a failed load, not "No fonts installed".
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        allowVector = !!data.vectorFonts;
        fontFiles.accept = allowVector ? '.cpfont,.ttf,.otf,.ttc' : '.cpfont';
        if (!fontFiles.disabled && fontFiles.files.length) updateFontSelection();
        // Build rows with DOM APIs and textContent so on-device family names
        // (which can contain arbitrary characters) cannot break markup or
        // execute script via innerHTML / inline onclick interpolation.
        el.replaceChildren();
        if (!data.families || data.families.length === 0) {
          const p = document.createElement('p');
          p.className = 'empty-state';
          p.textContent = 'No fonts installed';
          el.appendChild(p);
          return;
        }
        for (const f of data.families) {
          const row = document.createElement('div');
          row.className = 'family';

          const info = document.createElement('div');
          info.className = 'family-info';
          const h3 = document.createElement('h3');
          h3.textContent = f.name;
          info.appendChild(h3);
          const meta = document.createElement('span');
          meta.className = 'family-meta';
          // Vector families report size 0 (rendered at any size).
          const sizes = (f.sizes || []).filter(s => s > 0);
          const sizeText = sizes.length ? sizes.join(', ') + 'pt' : 'scalable';
          const filesSizes = (f.files || []).map(fi => formatSize(fi.size)).join(' + ');
          meta.textContent = sizeText + ' · ' + filesSizes;
          info.appendChild(meta);

          const btn = document.createElement('button');
          btn.className = 'btn btn-danger';
          btn.textContent = 'Delete';
          // Capture name in the closure rather than interpolating into onclick.
          const familyName = f.name;
          btn.addEventListener('click', () => deleteFamily(familyName));

          row.appendChild(info);
          row.appendChild(btn);
          el.appendChild(row);
        }
      } catch (e) {
        el.replaceChildren();
        const p = document.createElement('p');
        p.className = 'empty-state';
        p.textContent = 'Failed to load font list';
        el.appendChild(p);
      }
    }

    async function deleteFamily(name) {
      if (!await showWebConfirm('Delete font family "' + name + '"?')) return;
      try {
        const res = await fetch('/api/fonts/delete', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({family: name})
        });
        if (res.ok) {
          showWebToast('Deleted "' + name + '".', false);
        } else {
          showWebToast('Failed to delete "' + name + '".', true);
        }
      } catch (err) {
        showWebToast('Delete error: ' + err.message, true);
      }
      await loadFonts();
    }

    <!--#include file="../shared/FontUploadNames.js.inc" -->
    <!--#include file="../shared/FontUploadRequest.js.inc" -->

    const fontFiles = document.getElementById('fontFiles');
    const uploadFonts = document.getElementById('uploadFonts');
    const pickedInfo = document.getElementById('pickedInfo');
    const fontUploadProgress = document.getElementById('fontUploadProgress');
    const fontUploadStatus = document.getElementById('fontUploadStatus');
    const fontUploadPercent = document.getElementById('fontUploadPercent');
    const fontUploadBar = document.getElementById('fontUploadBar');

    function selectedFonts() {
      const files = Array.from(fontFiles.files)
        .filter(file => fontExtRe().test(file.name))
        .map(file => ({file, names: fontUploadNames(file.name)}));
      if (files.length === 0) {
        return {error: 'No supported fonts selected. Accepted formats: ' + supportedExts()};
      }
      const encoder = new TextEncoder();
      if (files.some(({names}) => !names || encoder.encode(names.family).length > 31 ||
                                    encoder.encode(names.filename).length > 127)) {
        return {error: 'Check the font names. Use Name_14.cpfont for bitmap fonts and keep the family name within 31 UTF-8 bytes.'};
      }
      const family = files[0].names.family;
      if (files.some(({names}) => names.family !== family)) {
        return {error: 'Please select files from a single font family.'};
      }
      return {files, family};
    }

    function updateFontSelection() {
      const {files, family, error} = selectedFonts();
      pickedInfo.textContent = error || files.length + ' file(s) → ' + family;
      uploadFonts.disabled = !!error;
    }

    fontFiles.addEventListener('change', () => {
      fontUploadProgress.hidden = true;
      updateFontSelection();
    });

    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (uploadFonts.disabled) return;
      const {files, family, error} = selectedFonts();
      if (error) {
        showWebToast(error, true);
        return;
      }

      fontFiles.disabled = uploadFonts.disabled = true;
      fontUploadProgress.hidden = false;
      fontUploadProgress.dataset.failed = 'false';
      setFontUploadPercent(0);
      const totalBytes = files.reduce((total, {file}) => total + file.size, 0) || 1;
      let savedBytes = 0;
      try {
        for (const [index, font] of files.entries()) {
          fontUploadStatus.textContent = 'Uploading ' + (index + 1) + '/' + files.length + ' · ' + font.file.name;
          const saved = await uploadFontFile(
            font,
            fraction => setFontUploadPercent(Math.min(99, (savedBytes + fraction * font.file.size) * 100 / totalBytes)),
            () => { fontUploadStatus.textContent = 'Saving to SD card…'; }
          ).catch(() => false);
          if (!saved) {
            fontUploadProgress.dataset.failed = 'true';
            fontUploadStatus.textContent = 'Upload failed · ' + font.file.name;
            return;
          }
          savedBytes += font.file.size;
        }

        fontFiles.value = pickedInfo.textContent = '';
        setFontUploadPercent(100);
        fontUploadStatus.textContent = 'Installed ' + files.length + ' file(s) in ' + family + '.';
      } finally {
        fontFiles.disabled = false;
        uploadFonts.disabled = !fontFiles.files.length;
        await loadFonts();
      }
    });

    loadFonts();
  </script>
  </body>
</html>
