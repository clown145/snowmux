<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>字体管理 - CrossMux</title>
    <style>
      h3 { margin: 0 0 8px 0; }
      .family {
        border-bottom: 1px solid var(--border-color);
        padding: 12px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .family:last-child { border-bottom: none; }
      .family-info { flex: 1; }
      .family-meta { color: var(--label-color); font-size: 0.9em; }
      .btn {
        padding: 6px 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9em;
      }
      .btn-danger {
        background: var(--danger-color);
        color: var(--button-text);
      }
      .btn-danger:hover { background: var(--danger-hover); }
      .btn-primary {
        background: var(--accent-color);
        color: var(--button-text);
      }
      .btn-primary:hover { background: var(--accent-hover-color); }
      .upload-form {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .upload-form input[type="text"] {
        padding: 6px 10px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        background: var(--bg);
        color: var(--font-color);
      }
      .upload-form input[type="file"] { flex: 1; min-width: 200px; }
      .empty { color: var(--label-color); text-align: center; padding: 20px; }
    </style>
    <link rel="stylesheet" href="/assets/web.css" />
  <link rel="icon" type="image/svg+xml" href="/assets/crosspoint-icon.svg" />
</head>
  <body class="web-ui">
    <!--#include file="../shared/Header.zh-CN.html.inc" -->
<main class="page-content">

    <div class="card" id="upload-fonts">
      <h2>上传字体</h2>
      <p class="family-meta">选择字体文件或文件夹，设备会按字体名自动创建家族目录。</p>
      <form class="upload-form" id="uploadForm">
        <input type="file" id="fontFiles" aria-label="上传字体" accept=".cpfont" multiple />
        <input type="file" id="fontFolder" webkitdirectory multiple hidden />
        <button type="button" id="pickFontFolder" class="btn">选择文件夹</button>
        <button type="submit" id="uploadFonts" class="btn btn-primary" disabled>上传</button>
      </form>
      <p id="pickedInfo" class="family-meta" aria-live="polite" style="margin: 8px 0 0;"></p>
    </div>

    <div class="card">
      <h2>已安装字体</h2>
      <div id="families"><p class="empty">正在读取…</p></div>
    </div>

  </main>
<!--#include file="../shared/Footer.zh-CN.html.inc" -->
<script>
    function formatSize(bytes) {
      if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
      if (bytes >= 1024) return (bytes / 1024).toFixed(0) + ' KB';
      return bytes + ' B';
    }

    // PSRAM boards also accept vector (.ttf/.otf/.ttc) uploads; set from /api/fonts.
    let allowVector = false;

    function fontExtRe() {
      return allowVector ? /\.(cpfont|ttf|otf|ttc)$/i : /\.cpfont$/i;
    }

    function supportedExts() {
      return allowVector ? '.cpfont、.ttf、.otf 或 .ttc' : '.cpfont';
    }

    async function loadFonts() {
      const el = document.getElementById('families');
      try {
        const res = await fetch('/api/fonts');
        const data = await res.json();
        allowVector = !!data.vectorFonts;
        fontFiles.accept = allowVector ? '.cpfont,.ttf,.otf,.ttc' : '.cpfont';
        if (!fontFiles.disabled && (fontFiles.files.length || fontFolder.files.length)) updateFontSelection();
        // Build rows with DOM APIs and textContent so on-device family names
        // (which can contain arbitrary characters) cannot break markup or
        // execute script via innerHTML / inline onclick interpolation.
        el.replaceChildren();
        if (!data.families || data.families.length === 0) {
          const p = document.createElement('p');
          p.className = 'empty';
          p.textContent = '尚未安装自定义字体';
          el.appendChild(p);
          return;
        }
        for (const f of data.families) {
          const row = document.createElement('div');
          row.className = 'family';

          const info = document.createElement('div');
          info.className = 'family-info';
          const h3 = document.createElement('h3');
          h3.textContent = f.name;
          info.appendChild(h3);
          const meta = document.createElement('span');
          meta.className = 'family-meta';
          const sizes = (f.sizes || []).filter(size => size > 0);
          const sizeText = sizes.length ? sizes.join(', ') + 'pt' : '可缩放';
          const filesSizes = (f.files || []).map(fi => formatSize(fi.size)).join(' + ');
          meta.textContent = sizeText + ' · ' + filesSizes;
          info.appendChild(meta);

          const btn = document.createElement('button');
          btn.className = 'btn btn-danger';
          btn.textContent = '删除';
          // Capture name in the closure rather than interpolating into onclick.
          const familyName = f.name;
          btn.addEventListener('click', () => deleteFamily(familyName));

          row.appendChild(info);
          row.appendChild(btn);
          el.appendChild(row);
        }
      } catch (e) {
        el.replaceChildren();
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = '无法读取字体列表';
        el.appendChild(p);
      }
    }

    async function deleteFamily(name) {
      if (!await showWebConfirm('确定删除字体家族“' + name + '”吗？')) return;
      try {
        const res = await fetch('/api/fonts/delete', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({family: name})
        });
        if (res.ok) {
          showWebToast('已删除“' + name + '”。', false);
        } else {
          showWebToast('删除“' + name + '”失败。', true);
        }
      } catch (err) {
        showWebToast('删除出错：' + err.message, true);
      }
      await loadFonts();
    }

    <!--#include file="../shared/FontUploadNames.js.inc" -->

    const fontFiles = document.getElementById('fontFiles');
    const fontFolder = document.getElementById('fontFolder');
    const pickFontFolder = document.getElementById('pickFontFolder');
    const uploadFonts = document.getElementById('uploadFonts');
    const pickedInfo = document.getElementById('pickedInfo');

    function selectedFonts() {
      const files = Array.from(fontFolder.files.length ? fontFolder.files : fontFiles.files)
        .filter(file => fontExtRe().test(file.name))
        .map(file => ({file, names: fontUploadNames(file.name)}));
      if (files.length === 0) {
        return {error: '尚未选择受支持的字体。支持的格式：' + supportedExts()};
      }
      const encoder = new TextEncoder();
      if (files.some(({names}) => !names || encoder.encode(names.family).length > 31 ||
                                    encoder.encode(names.filename).length > 127)) {
        return {error: '请检查文件名。点阵字体请用「字体名_字号.cpfont」，家族名最长为 31 个 UTF-8 字节。'};
      }
      const family = files[0].names.family;
      if (files.some(({names}) => names.family !== family)) {
        return {error: '请只选择同一个字体家族的文件。'};
      }
      return {files, family};
    }

    function updateFontSelection() {
      const {files, family, error} = selectedFonts();
      pickedInfo.textContent = error || files.length + ' 个文件 → ' + family;
      uploadFonts.disabled = !!error;
    }

    pickFontFolder.addEventListener('click', () => fontFolder.click());
    fontFiles.addEventListener('change', () => {
      fontFolder.value = '';
      updateFontSelection();
    });
    fontFolder.addEventListener('change', () => {
      fontFiles.value = '';
      updateFontSelection();
    });

    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (uploadFonts.disabled) return;
      const {files, family, error} = selectedFonts();
      if (error) {
        showWebToast(error, true);
        return;
      }

      fontFiles.disabled = fontFolder.disabled = pickFontFolder.disabled = uploadFonts.disabled = true;
      let uploaded = 0;
      try {
        for (const {file, names} of files) {
          showWebToast('正在上传 ' + (uploaded + 1) + '/' + files.length + '：' + file.name, false);
          const formData = new FormData();
          formData.append('family', family);
          formData.append('file', file, names.filename);
          try {
            const res = await fetch('/api/fonts/upload', {method: 'POST', body: formData});
            const data = await res.json();
            if (!res.ok || !data.ok) throw new Error('字体无效或写入 SD 卡失败');
          } catch (err) {
            showWebToast(file.name + ' 上传失败：' + err.message, true);
            return;
          }
          uploaded++;
        }

        fontFiles.value = fontFolder.value = pickedInfo.textContent = '';
        showWebToast('已将 ' + uploaded + ' 个文件上传到字体家族「' + family + '」。', false);
      } finally {
        fontFiles.disabled = fontFolder.disabled = pickFontFolder.disabled = false;
        uploadFonts.disabled = !(fontFiles.files.length || fontFolder.files.length);
        await loadFonts();
      }
    });

    loadFonts();
  </script>
  </body>
</html>
