name: Release Xuesu firmware and publish Pages
run-name: ${{ inputs.dry_run && 'Rehearse' || 'Publish' }} ${{ inputs.release_tag || 'Xuesu flasher' }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag (leave blank to update the flasher only)
        type: string
      dry_run:
        description: Rehearse the tagged firmware build and package the site without publishing
        type: boolean
        default: false

concurrency:
  group: ${{ inputs.dry_run && format('xuesu-rehearsal-{0}', github.ref) || 'xuesu-release' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested version and branch
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == false && "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Run publication from the default branch."
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" || "$DRY_RUN" == true ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^xuesu-v[0-9]{1,9}\.[0-9]{1,9}\.[0-9]{1,9}$ ]]; then
              echo "::error::Enter a version tag such as xuesu-v0.1.0."
              exit 1
            fi
          fi

  firmware:
    needs: request
    if: inputs.release_tag != ''
    uses: ./.github/workflows/xuesu-build.yml
    with:
      release_tag: ${{ inputs.release_tag }}

  publish:
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xuesu-firmware
          path: firmware-artifact
      - name: Prepare verified release files
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir release
          digest=$(jq -er --arg tag "$RELEASE_TAG" --arg commit "$GITHUB_SHA" '
            select(.release_tag == $tag and .commit == $commit)
            | .assets[0].digest | select(test("^sha256:[a-f0-9]{64}$")) | sub("^sha256:"; "")
          ' firmware-artifact/api/v1/firmware/latest.json)
          firmware="${RELEASE_TAG}-ota1.bin"
          cp "firmware-artifact/firmware/${digest}.bin" "release/${firmware}"
          cp firmware-artifact/firmware/LICENSE.txt release/LICENSE.txt
          printf '%s  %s\n' "$digest" "$firmware" > release/SHA256SUMS.txt
          (cd release && sha256sum --check SHA256SUMS.txt)

      - name: Attach files and publish the draft release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          release_id=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")
          draft=$(jq -r '.draft' <<< "$release")
          target=$(jq -er '.target_commitish' <<< "$release")
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" | jq -r \
            --arg tag "refs/tags/$RELEASE_TAG" '.[] | select(.ref == $tag) | .ref')
          if [[ -n "$ref" ]]; then
            target=$(gh api "repos/$GITHUB_REPOSITORY/commits/$ref" --jq .sha)
          elif [[ "$draft" == true && "$target" == "$DEFAULT_BRANCH" ]]; then
            target="$GITHUB_SHA"
          fi
          if [[ "$target" != "$GITHUB_SHA" ]]; then
            echo "::error::Release $RELEASE_TAG targets $target, expected $GITHUB_SHA."
            exit 1
          fi

          for file in "release/${RELEASE_TAG}-ota1.bin" release/LICENSE.txt release/SHA256SUMS.txt; do
            name=${file##*/}
            existing=$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest // "missing"' <<< "$release")
            if [[ -z "$existing" && "$draft" == true ]]; then
              gh release upload "$RELEASE_TAG" "$file" --repo "$GITHUB_REPOSITORY"
            elif [[ "$existing" != "sha256:$(sha256sum "$file" | cut -d' ' -f1)" ]]; then
              echo "::error::Release asset $name is missing or has a different digest."
              exit 1
            fi
          done
          if [[ "$draft" == true ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft=false
          fi

  site:
    needs: [request, publish]
    if: ${{ !cancelled() && needs.request.result == 'success' &&
      (inputs.release_tag == '' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: flasher/package-lock.json
      - name: Build and test the Web Serial flasher
        working-directory: flasher
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - uses: actions/download-artifact@v4
        if: inputs.release_tag != ''
        with:
          name: xuesu-firmware
          path: flasher/dist
      - name: Reuse the firmware from the deployed release
        if: inputs.release_tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          host="${GITHUB_REPOSITORY_OWNER,,}.github.io"
          repo="${GITHUB_REPOSITORY#*/}"
          site="https://$host"
          if [[ "${repo,,}" != "$host" ]]; then site="$site/$repo"; fi
          manifest=flasher/dist/api/v1/firmware/latest.json
          mkdir -p "$(dirname "$manifest")" flasher/dist/firmware
          curl -fLsS --retry 3 --max-time 60 -H 'Cache-Control: no-cache' \
            "$site/api/v1/firmware/latest.json?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -o "$manifest"
          tag=$(jq -er --arg repo "$GITHUB_REPOSITORY" '
            select(.schema == 1 and .repository == $repo and .board == "xuesu-300-std" and .target_partition == "ota_1")
            | .release_tag | select(test("^xuesu-v[0-9]+[.][0-9]+[.][0-9]+$"))' "$manifest")
          digest=$(jq -er '.assets[0].digest | select(test("^sha256:[a-f0-9]{64}$")) | sub("^sha256:"; "")' "$manifest")
          firmware="$tag-ota1.bin"
          assets="$RUNNER_TEMP/xuesu-release"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$assets" \
            --pattern "$firmware" --pattern LICENSE.txt
          (cd "$assets" && printf '%s  %s\n' "$digest" "$firmware" | sha256sum --check)
          cp "$assets/$firmware" "flasher/dist/firmware/$digest.bin"
          cp "$assets/LICENSE.txt" flasher/dist/firmware/LICENSE.txt
      - name: Add GitHub Release date and notes to the OTA manifest
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest=flasher/dist/api/v1/firmware/latest.json
          tag=$(jq -er '.release_tag' "$manifest")
          body="$RUNNER_TEMP/xuesu-release-body.md"
          release=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body,publishedAt)
          jq -r '.body // ""' <<< "$release" > "$body"
          published_at=$(jq -er '.publishedAt | select(length > 0)' <<< "$release")
          jq --arg date "$published_at" '.published_at = $date' "$manifest" > "$manifest.tmp"
          mv "$manifest.tmp" "$manifest"
          python3 scripts/add_xuesu_release_notes.py "$manifest" "$body"
      - name: Upload GitHub Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: flasher/dist

  deploy:
    needs: site
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
