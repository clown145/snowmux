name: Release Xuesu firmware and publish Pages

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: xuesu-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  firmware:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'xuesu-v')
    uses: ./.github/workflows/xuesu-build.yml
    with:
      release_tag: ${{ github.event.release.tag_name }}
      published_at: ${{ github.event.release.published_at }}

  publish:
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xuesu-firmware
          path: firmware-artifact
      - name: Attach verified files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir release
          digest=$(jq -er '.assets[0].digest | sub("^sha256:"; "")' firmware-artifact/api/v1/firmware/latest.json)
          firmware="${RELEASE_TAG}-ota1.bin"
          cp "firmware-artifact/firmware/${digest}.bin" "release/${firmware}"
          cp firmware-artifact/firmware/LICENSE.txt release/LICENSE.txt
          printf '%s  %s\n' "$digest" "$firmware" > release/SHA256SUMS.txt
          (cd release && sha256sum --check SHA256SUMS.txt)

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$RUNNER_TEMP/xuesu-release.json"
          for file in "release/${firmware}" release/LICENSE.txt release/SHA256SUMS.txt; do
            name=${file##*/}
            existing=$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest // "missing"' "$RUNNER_TEMP/xuesu-release.json")
            if [[ -z "$existing" ]]; then
              gh release upload "$RELEASE_TAG" "$file" --repo "$GITHUB_REPOSITORY"
            elif [[ "$existing" != "sha256:$(sha256sum "$file" | cut -d' ' -f1)" ]]; then
              echo "::error::Existing release asset $name has a different digest. Publish a new version for a changed build."
              exit 1
            fi
          done

  site:
    needs: publish
    if: ${{ !cancelled() && (needs.publish.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: flasher/package-lock.json
      - name: Build and test the Web Serial flasher
        working-directory: flasher
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - uses: actions/download-artifact@v4
        if: github.event_name == 'release'
        with:
          name: xuesu-firmware
          path: flasher/dist
      - name: Reuse the firmware from the deployed release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          host="${GITHUB_REPOSITORY_OWNER,,}.github.io"
          repo="${GITHUB_REPOSITORY#*/}"
          site="https://$host"
          if [[ "${repo,,}" != "$host" ]]; then site="$site/$repo"; fi
          manifest=flasher/dist/api/v1/firmware/latest.json
          mkdir -p "$(dirname "$manifest")" flasher/dist/firmware
          curl -fLsS --retry 3 --max-time 60 -H 'Cache-Control: no-cache' \
            "$site/api/v1/firmware/latest.json?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -o "$manifest"
          tag=$(jq -er --arg repo "$GITHUB_REPOSITORY" '
            select(.schema == 1 and .repository == $repo and .board == "xuesu-300-std" and .target_partition == "ota_1")
            | .release_tag | select(test("^xuesu-v[0-9]+[.][0-9]+[.][0-9]+$"))' "$manifest")
          digest=$(jq -er '.assets[0].digest | select(test("^sha256:[a-f0-9]{64}$")) | sub("^sha256:"; "")' "$manifest")
          firmware="$tag-ota1.bin"
          assets="$RUNNER_TEMP/xuesu-release"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$assets" \
            --pattern "$firmware" --pattern LICENSE.txt
          (cd "$assets" && printf '%s  %s\n' "$digest" "$firmware" | sha256sum --check)
          cp "$assets/$firmware" "flasher/dist/firmware/$digest.bin"
          cp "$assets/LICENSE.txt" flasher/dist/firmware/LICENSE.txt
      - name: Upload GitHub Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: flasher/dist

  deploy:
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
