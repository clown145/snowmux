name: Build Xuesu firmware and flasher

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
      published_at:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: flasher/package-lock.json
      - name: Build and test the Web Serial flasher
        working-directory: flasher
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Prepare the Xuesu board and panel tables
        run: |
          git -C freeink-sdk apply --check ../scripts/xuesu_freeink_sdk.patch
          git -C freeink-sdk apply ../scripts/xuesu_freeink_sdk.patch
          mkdir -p .pio
          curl -fL --retry 3 --max-time 180 https://xiaomoreader.top/XueSu_300OTA/firmware10033.bin -o .pio/xuesu-factory-1.3.3.bin
          python scripts/prepare_xuesu_panel_lut.py .pio/xuesu-factory-1.3.3.bin
      - name: Build the Xuesu app
        env:
          XUESU_RELEASE_TAG: ${{ inputs.release_tag || 'xuesu-v0.0.0' }}
        run: |
          python -m pip install pioarduino==6.2.0
          python scripts/patch_pioarduino_cache.py --prepare-platform
          pio run -e xuesu_300
      - name: Package the site, OTA1 app, and update manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag || 'xuesu-v0.0.0' }}
          PUBLISHED_AT: ${{ inputs.published_at }}
        run: |
          python scripts/package_xuesu_pages.py --output flasher/dist \
            --version "$RELEASE_TAG" --published-at "${PUBLISHED_AT:-$(date -u +%FT%TZ)}" \
            --commit "$(git rev-parse HEAD)" --repository "$GITHUB_REPOSITORY"
          python scripts/build_release_license.py --env xuesu_300 --repository "$GITHUB_REPOSITORY" \
            --output flasher/dist/firmware/LICENSE.txt
      - name: Upload the built site and firmware
        uses: actions/upload-artifact@v4
        with:
          name: xuesu-site
          path: flasher/dist
          if-no-files-found: error
          overwrite: true
