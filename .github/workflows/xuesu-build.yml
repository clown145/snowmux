name: Build Xuesu firmware

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
      published_at:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PIOARDUINO_VERSION: '6.2.0'
      PLATFORMIO_BUILD_CACHE_DIR: .cache/xuesu_300
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        if: github.event_name != 'release'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: flasher/package-lock.json
      - name: Cache the PlatformIO platform and tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
            ~/.platformio/tools
          key: xuesu-tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.PIOARDUINO_VERSION }}-${{ hashFiles('platformio.ini', 'scripts/patch_pioarduino_cache.py') }}
      - name: Cache the Xuesu library dependencies
        uses: actions/cache@v4
        with:
          path: .pio/libdeps/xuesu_300
          key: xuesu-libdeps-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.PIOARDUINO_VERSION }}-${{ hashFiles('platformio.ini', 'scripts/configure_xuesu_libmobi.py') }}
      - name: Restore the Xuesu compilation cache
        id: xuesu-build-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PLATFORMIO_BUILD_CACHE_DIR }}
          key: xuesu-objects-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.PIOARDUINO_VERSION }}-${{ hashFiles('platformio.ini', 'scripts/patch_pioarduino_cache.py') }}-${{ github.sha }}
          restore-keys: |
            xuesu-objects-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.PIOARDUINO_VERSION }}-${{ hashFiles('platformio.ini', 'scripts/patch_pioarduino_cache.py') }}-
      - name: Build and test the Web Serial flasher
        if: github.event_name != 'release'
        working-directory: flasher
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Prepare the Xuesu board and panel tables
        run: |
          git -C freeink-sdk apply --check ../scripts/xuesu_freeink_sdk.patch
          git -C freeink-sdk apply ../scripts/xuesu_freeink_sdk.patch
          mkdir -p .pio
          curl -fL --retry 3 --max-time 180 https://xiaomoreader.top/XueSu_300OTA/firmware10033.bin -o .pio/xuesu-factory-1.3.3.bin
          python scripts/prepare_xuesu_panel_lut.py .pio/xuesu-factory-1.3.3.bin
      - name: Build the Xuesu app
        env:
          XUESU_RELEASE_TAG: ${{ inputs.release_tag || 'xuesu-v0.0.0' }}
        run: |
          python -m pip install "pioarduino==$PIOARDUINO_VERSION"
          python scripts/patch_pioarduino_cache.py --prepare-platform
          pio run -e xuesu_300
      - name: Run Xuesu host regressions
        env:
          PYTHONPATH: scripts/tests
        run: |
          python -m unittest discover -v -s scripts/tests -p 'test_xuesu_*.py'
          python -m unittest -v test_xtc_reader test_airpage_display_retry test_web_source_parity \
            test_builtin_font_shrink test_pioarduino_cache test_reading_ui_regressions test_ui_surface_sync \
            test_firmware_update_refresh
      - name: Package the OTA1 app and update manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag || 'xuesu-v0.0.0' }}
          PUBLISHED_AT: ${{ inputs.published_at }}
        run: |
          python scripts/package_xuesu_pages.py --output firmware-artifact \
            --version "$RELEASE_TAG" --published-at "${PUBLISHED_AT:-$(date -u +%FT%TZ)}" \
            --commit "$(git rev-parse HEAD)" --repository "$GITHUB_REPOSITORY"
          python scripts/build_release_license.py --env xuesu_300 --repository "$GITHUB_REPOSITORY" \
            --output firmware-artifact/firmware/LICENSE.txt
      - name: Upload the verified firmware
        uses: actions/upload-artifact@v4
        with:
          name: xuesu-firmware
          path: firmware-artifact
          if-no-files-found: error
          overwrite: true
      - name: Save the Xuesu compilation cache from main
        if: github.ref == 'refs/heads/main' && steps.xuesu-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PLATFORMIO_BUILD_CACHE_DIR }}
          key: ${{ steps.xuesu-build-cache.outputs.cache-primary-key }}
